<a href="{% url url %}" class="bp-mod" data-mod="{{ id }}" style="--c:{{ color }}">
  <button type="button" class="bp-pin" data-pin="{{ id }}" title="Fijar en favoritos"><i class="ti ti-star"></i></button>
  <div class="bp-mod-icon"><i class="ti {{ icono }}"></i></div>
  <h3>{{ titulo }}</h3>
  <p>{{ desc }}</p>
  <div class="bp-mod-foot"><span class="go">Abrir <i class="ti ti-arrow-right"></i></span></div>
</a>
